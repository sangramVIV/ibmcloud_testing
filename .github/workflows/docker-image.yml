name: Docker Image CI/CD with AWS ECR and EC2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-deploy:
    name: Build, Push to ECR and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Configure AWS credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1 # Change to your AWS region

    # Step 3: Login to ECR
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    # Step 4: Build and Tag Docker Image
    - name: Build Docker Image
      run: |
        REPO_URI="public.ecr.aws/i0h4r7u1/devops_testing"
        docker build ./myapp/ -t $REPO_URI:latest
    
    # Step 5: Push Docker Image to ECR
    - name: Push Docker Image to ECR
      run: |
        REPO_URI="public.ecr.aws/i0h4r7u1/devops_testing"
        docker push $REPO_URI:latest
        
       

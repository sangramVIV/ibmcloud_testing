name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR Public
      run: |
        aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

    - name: Build Docker Image
      run: |
        REPO_URI="public.ecr.aws/i0h4r7u1/webserver_testing"
        docker build ./myapp/ -t $REPO_URI:latest

    - name: Push Docker Image to ECR
      run: |
        REPO_URI="public.ecr.aws/i0h4r7u1/webserver_testing"
        docker push $REPO_URI:latest

    
    - name: Deploy to EC2 via SSH and Run Docker
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          docker pull public.ecr.aws/i0h4r7u1/webserver_testing:latest
          docker stop webserver_testing || true
          docker rm webserver_testing || true
          docker run -d -p 80:80 --name webserver_testing public.ecr.aws/i0h4r7u1/webserver_testing:latest
